<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#ffffff}
.win{width:1000px;height:400px;background:#0c0c0c;border-radius:10px;overflow:hidden;font-family:"Cascadia Mono","Consolas","Menlo",monospace;position:relative}
.bar{height:56px;background:#202020;display:flex;align-items:flex-end;color:#fff;font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:17px}
.tab{background:#0c0c0c;height:44px;border-radius:8px 8px 0 0;margin-left:8px;padding:0 16px;display:flex;align-items:center;gap:12px;width:390px;box-sizing:border-box}
.ico{width:22px;height:22px;background:#2d6bd4;border-radius:4px;display:inline-block;position:relative}
.ico:after{content:"›_";color:#fff;font-size:13px;font-weight:700;position:absolute;left:4px;top:1px}
.tab .x{margin-left:auto;font-size:20px}
.ctl{display:flex;align-items:center;height:44px;gap:26px;padding-left:22px;font-size:20px}
.right{margin-left:auto;display:flex;gap:44px;padding-right:28px;font-size:18px;height:44px;align-items:center}
pre{margin:0;padding:22px 20px;color:#f2f2f2;font-size:20px;line-height:1.5;white-space:pre}
.code{border:3px solid #e5484d;border-radius:6px;padding:0 4px;margin:0 -7px 0 0}
.cur{display:inline-block;width:2px;height:22px;background:#f2f2f2;vertical-align:-4px}
</style></head><body>
<div class="win">
 <div class="bar">
  <div class="tab"><span class="ico"></span>Windows PowerShell<span class="x">✕</span></div>
  <div class="ctl"><span>+</span><span>⌄</span></div>
  <div class="right"><span>—</span><span>☐</span><span>✕</span></div>
 </div>
<pre>? Authenticate Git with your GitHub credentials? Yes

! One-time code (<span class="code">A1B2-C3D4</span>) copied to clipboard
Press Enter to open https://github.com/login/device in your browser...
<span class="cur"></span></pre>
</div>
</body></html>
