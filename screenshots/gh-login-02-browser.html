<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#f6f8fa;font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;color:#1f2328}
.page{width:760px;height:800px;display:flex;flex-direction:column;align-items:center;padding-top:60px;box-sizing:border-box}
.logo{width:96px;height:96px;margin-bottom:56px}
.card{width:560px;background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:36px 28px 32px;box-sizing:border-box;text-align:center}

.who{font-size:17px;margin-bottom:28px;display:flex;justify-content:center;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:#e8dcb3;display:inline-block;position:relative;overflow:hidden}
.av:after{content:"";position:absolute;left:6px;top:8px;width:18px;height:14px;background:#b8a95a;border-radius:3px}
p{font-size:17px;line-height:1.5;margin:0 0 28px}
.boxes{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:34px}
.b{width:56px;height:70px;border:1px solid #d0d7de;border-radius:6px;font-size:28px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,"Menlo","Consolas",monospace;color:#1f2328;background:#fff}
.b.last{border:2px solid #0969da}
.dash{width:18px;text-align:center;font-size:20px;color:#57606a}
.btn{background:#1f883d;color:#fff;font-weight:600;font-size:17px;border-radius:6px;padding:16px;margin-bottom:22px}
.foot{font-size:14px;color:#57606a}
